
      - name: Build PS4 PKG
        run: |
          docker run --rm \
            --user 0:0 \
            -w /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            openorbisofficial/toolchain:latest \
            bash -lc 'make -C hello_world && cd hello_world && PkgTool.Core pkg_build pkg/pkg.gp4 .'
